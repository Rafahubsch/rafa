<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Um recadinho especial ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffeef2;
      font-family: 'Nunito', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Container Principal */
    .card {
      background: #ffffff;
      border: 4px solid #ffb3c6;
      border-radius: 24px;
      padding: 30px 25px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(255, 143, 171, 0.3);
      position: relative;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      color: #ff5c8a;
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    /* Personagem / Animação em Pixel/Emoji */
    .character-box {
      font-size: 4rem;
      margin: 15px 0;
      animation: bounce 1.5s infinite ease-in-out alternate;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }

    p {
      color: #6c5ce7;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    /* Botões */
    .btn-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
      min-height: 50px;
    }

    button {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      padding: 12px 24px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-yes {
      background-color: #ff5c8a;
      color: white;
      box-shadow: 0 4px 12px rgba(255, 92, 138, 0.4);
    }

    .btn-yes:hover {
      transform: scale(1.08);
      background-color: #ff3366;
    }

    .btn-no {
      background-color: #a29bfe;
      color: white;
      position: absolute;
      right: 20px;
    }

    /* Mensagem Secreta */
    .secret-message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #fff0f5;
      border-radius: 16px;
      border: 2px dashed #ff8fa3;
      color: #ff3366;
      font-weight: 800;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Corações Caindo */
    .heart {
      position: fixed;
      top: -10px;
      font-size: 1.5rem;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="title">Aviso Importante! 💌</h1>

    <div class="character-box" id="character">🧸</div>

    <p id="question">Você sabia que é o namorado mais aurudo e 67?</p>

    <div class="btn-container" id="btnGroup">
      <button class="btn-yes" onclick="accepted()">Sim, eu sei! 🥰</button>
      <button class="btn-no" id="noBtn" onmouseover="moveButton()">Não 🙈</button>
    </div>

    <div class="secret-message" id="secret">
      💖 Te amo daqui até a lua (e volta)! Obrigada por ser meu porto seguro. Você é meu lugar favorito no mundo! ✨ Prime o botão e vem me dar um abraço! 🙈
    </div>
  </div>

  <script>
    // Fazer o botão "Não" fugir do ponteiro
    function moveButton() {
      const btn = document.getElementById('noBtn');
      const x = Math.random() * (window.innerWidth - 100) - (window.innerWidth / 2) + 50;
      const y = Math.random() * (window.innerHeight - 100) - (window.innerHeight / 2) + 50;

      btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    // Ação ao clicar no "Sim"
    function accepted() {
      document.getElementById('title').innerText = "Eu já sabia! ✨";
      document.getElementById('character').innerText = "🐱💖🐶";
      document.getElementById('question').innerText = "Resposta correta com sucesso!";
      document.getElementById('btnGroup').style.display = "none";
      document.getElementById('secret').style.display = "block";

      // Chuva de corações
      for (let i = 0; i < 30; i++) {
        setTimeout(createHeart, i * 100);
      }
    }

    // Criar corações caindo na tela
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');

      const items = ['💖', '🌸', '✨', '💕', '🍓'];
      heart.innerText = items[Math.floor(Math.random() * items.length)];

      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 2 + 3 + 's';

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }
  </script>
</body>
</html>
